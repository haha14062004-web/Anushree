name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: npm install
      - name: Add Android
        run: npx cap add android
      - name: Use the Saraswati icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp icon.png "$d/ic_launcher.png"
            cp icon.png "$d/ic_launcher_round.png"
            cp icon.png "$d/ic_launcher_foreground.png"
          done
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: anushree-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
