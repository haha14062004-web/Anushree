<meta name="theme-color" content="#460B2F">
<title>Anushree Music Classes – Fee Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--headink:#FFF7EA;--head:var(--t-head,#460B2F);--red:var(--t-red,#9A031E);--saf:var(--t-saf,#FB8B24);--org:var(--t-org,#E36414);--ok:var(--t-ok,#2f6b3a);--paper:var(--t-paper,#FFF7EA);--ink:#2A1020;--mute:#6f505c;--line:color-mix(in srgb,var(--paper) 78%,#7a4a2a);--box:color-mix(in srgb,var(--paper) 50%,#fff);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:color-mix(in srgb,var(--t-head,#460B2F) 30%,#0c0509);--ink:#f6e6d8;--mute:#c4a1a8;--head:color-mix(in srgb,var(--t-head,#460B2F) 70%,#000);--red:color-mix(in srgb,var(--t-red,#9A031E) 55%,#fff);--ok:color-mix(in srgb,var(--t-ok,#2f6b3a) 55%,#fff);--line:color-mix(in srgb,var(--paper) 75%,#fff);--box:color-mix(in srgb,var(--paper) 88%,#fff);color-scheme:dark}}
:root[data-theme="dark"]{--paper:color-mix(in srgb,var(--t-head,#460B2F) 30%,#0c0509);--ink:#f6e6d8;--mute:#c4a1a8;--head:color-mix(in srgb,var(--t-head,#460B2F) 70%,#000);--red:color-mix(in srgb,var(--t-red,#9A031E) 55%,#fff);--ok:color-mix(in srgb,var(--t-ok,#2f6b3a) 55%,#fff);--line:color-mix(in srgb,var(--paper) 75%,#fff);--box:color-mix(in srgb,var(--paper) 88%,#fff);color-scheme:dark}
html,body{height:auto;margin:0}
body{background:var(--paper);color:var(--ink);font:17px/1.5 "Tiro Devanagari Hindi",Georgia,serif;max-width:640px;margin:0 auto}
header{background:var(--head);color:var(--headink);padding:18px 18px 0;border-bottom:5px solid var(--saf)}
h1{font:400 26px/1.15 "Yatra One","Tiro Devanagari Hindi",Georgia,serif;margin:0 0 2px}
.sub{font-size:14px;opacity:.8;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{background:none;border:1px solid var(--saf);color:var(--saf);border-radius:4px;padding:3px 10px;font:inherit;font-size:14px;cursor:pointer}
nav{display:flex;gap:0;margin-top:6px}
nav button{flex:1;background:none;border:0;color:var(--headink);opacity:.7;font:inherit;padding:10px 4px;border-bottom:4px solid transparent;margin-bottom:-5px;cursor:pointer}
nav button[aria-selected="true"]{opacity:1;border-bottom-color:var(--paper);background:var(--paper);color:var(--red);border-radius:6px 6px 0 0}
main{padding:14px 18px 40px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.mon{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.mon h2{font:400 22px "Yatra One","Tiro Devanagari Hindi",serif;margin:0}
.arr{background:var(--box);border:1px solid var(--line);color:var(--ink);width:44px;height:40px;border-radius:6px;font-size:20px}
.tot{border-left:6px solid var(--org);padding:2px 0 2px 12px;margin:0 0 12px}
.tot b{font-size:21px;color:var(--red)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.row .nm{background:none;border:0;color:var(--ink);text-align:left;padding:0;font-size:18px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.row .fee{color:var(--mute);font-size:14px}
.st{grid-row:1/3;grid-column:2;min-width:116px;min-height:44px;border-radius:6px;border:2px solid var(--org);background:none;color:var(--org);font-size:15px;padding:4px 10px}
.st.paid{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.st.paid small{display:block;font-size:12px;opacity:.9}
.empty{color:var(--mute);padding:20px 0}
form.add{background:var(--box);border:1px solid var(--line);border-left:6px solid var(--saf);padding:12px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 2px}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:9px;border:1px solid var(--line);border-radius:5px;background:var(--paper);color:var(--ink)}
textarea{min-height:90px;font-size:13px}
.go{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 18px;margin-top:10px;min-height:44px}
.gh{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:10px 14px;min-height:44px;margin-top:10px}
.sm{font-size:14px;padding:6px 10px;min-height:36px;margin:0 0 0 6px}
.hist{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.due{color:var(--org)}.ok{color:var(--ok)}
.back{background:none;border:0;color:var(--red);padding:0;margin-bottom:8px;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(30,5,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--paper);width:100%;max-width:640px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border-top:5px solid var(--saf)}
.sheet h3{font:400 20px "Yatra One","Tiro Devanagari Hindi",serif;margin:0 0 4px}
.note{color:var(--mute);font-size:14px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:54px;height:54px;border-radius:10px;border:2px solid var(--saf);flex:none;object-fit:cover}
nav button{font-size:15px}
.th{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0;color:var(--ink);text-align:left;font-size:17px}
.sw{display:flex;width:120px;height:28px;border-radius:4px;overflow:hidden;flex:none}.sw i{flex:1}
.th[aria-pressed="true"]{font-weight:700;border-left:6px solid var(--org);padding-left:10px}
.gh[aria-pressed="true"]{background:var(--red);color:#fff;border-color:var(--red)}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=new Date();
const ym=(y,m)=>y+'-'+String(m+1).padStart(2,'0');
const today=()=>now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
const curM=ym(now.getFullYear(),now.getMonth());
let tab='m',cur=curM,hid=null;
function mname(m){const [y,n]=m.split('-');return MN[S.lang][+n-1]+' '+y}
function shift(m,d){let [y,n]=m.split('-').map(Number);n+=d-1;y+=Math.floor(n/12);n=((n%12)+12)%12;return ym(y,n)}
function dfmt(d){if(!d)return'';const [y,m,dd]=d.split('-');return +dd+' '+MN[S.lang][+m-1].slice(0,S.lang==='en'?3:99)+' '+y}
function rupee(n){return '₹'+Number(n).toLocaleString('en-IN')}
function pay(id,m){return S.pay[id+'|'+m]}
function chrome(){
  applyTheme();
  document.documentElement.lang=S.lang==='hi'?'hi':'en';
  $('ttl').textContent=t('ttl');$('sub').textContent=t('sub');$('lang').textContent=t('lang');
  $('nav').innerHTML=[['m','m'],['s','s'],['c','c'],['b','b']].map(x=>`<button role="tab" data-tab="${x[0]}" aria-selected="${tab===x[0]&&hid===null||(x[0]==='s'&&hid!==null)}">${t(x[1])}</button>`).join('');
}
function monthView(){
  const list=S.students.filter(s=>s.active&&s.start<=cur);
  let got=0,cnt=0;
  const rows=list.map(s=>{const p=pay(s.id,cur);if(p){got+=+p.amount}else cnt++;
    return `<div class="row"><button class="nm" data-h="${s.id}">${esc(s.name)}</button><span class="fee">${rupee(s.fee)}</span>
    <button class="st ${p?'paid':''}" data-pay="${s.id}">${p?t('paid')+'<small>'+dfmt(p.date)+'</small>':t('due')}</button></div>`}).join('');
  return `<div class="mon"><button class="arr" data-mv="-1" aria-label="previous">‹</button><h2>${mname(cur)}</h2><button class="arr" data-mv="1" aria-label="next">›</button></div>
  <p class="tot"><b>${rupee(got)}</b> ${t('col')}<br><span class="note">${cnt} ${t('dn')}</span></p>${rows||`<p class="empty">${t('none')}</p>`}`;
}
function studentsView(){
  const act=S.students.filter(s=>s.active),rm=S.students.filter(s=>!s.active);
  return `<form class="add" id="addf"><b>${t('add')}</b><label for="an">${t('name')}</label><input id="an" autocomplete="off">
  <label for="af">${t('fee')}</label><input id="af" type="number" inputmode="numeric" min="0">
  <label for="as">${t('start')}</label><input id="as" type="month" value="${curM}">
  <button class="go" type="submit">${t('add')}</button><p class="note" id="err"></p></form>
  ${act.map(s=>`<div class="row"><button class="nm" data-h="${s.id}">${esc(s.name)}</button><span class="fee">${rupee(s.fee)}</span>
  <span style="grid-row:1/3;grid-column:2"><button class="gh sm" data-fee="${s.id}">${t('chg')}</button><button class="gh sm" data-rm="${s.id}">${t('rem')}</button></span></div>`).join('')}
  ${rm.length?`<h3 class="note" style="margin-top:22px">${t('removed')}</h3>`+rm.map(s=>`<div class="row"><span>${esc(s.name)}</span><span style="grid-row:1/3;grid-column:2"><button class="gh sm" data-rs="${s.id}">${t('rest')}</button></span></div>`).join(''):''}`;
}
function histView(){
  const s=S.students.find(x=>x.id===hid);if(!s){hid=null;return render()}
  let rows='',tot=0,m=curM;
  while(m>=s.start){const p=pay(s.id,m);if(p)tot+=+p.amount;
    rows+=`<div class="hist"><span>${mname(m)}</span><span class="${p?'ok':'due'}">${p?t('paid')+' · '+dfmt(p.date)+' · '+rupee(p.amount):t('due')+' · '+rupee(s.fee)}</span></div>`;m=shift(m,-1)}
  return `<button class="back" data-back="1">${t('back')}</button><h2 style="font:400 24px 'Yatra One','Tiro Devanagari Hindi',serif;margin:0">${esc(s.name)}</h2>
  <p class="tot"><b>${rupee(tot)}</b> ${t('tp')}<br><span class="note">${t('hist')}</span></p>${rows}`;
}
function backupView(){
  return `<p class="note">${t('ps')}</p><p>${t('bk')}</p><textarea id="bt" readonly>${esc(JSON.stringify({students:S.students,pay:S.pay}))}</textarea>
  <button class="gh" id="sel">${t('b')} ✓</button>
  <h3 style="margin-top:26px;font:400 19px 'Yatra One','Tiro Devanagari Hindi',serif">${t('rs')}</h3><textarea id="rt" placeholder="${t('rsh')}"></textarea>
  <button class="go" id="rb">${t('rsb')}</button><p class="note" id="rmsg"></p>`;
}
const THEMES=[
{id:'trad',n:'Indian Traditional',p:['#460B2F','#9A031E','#FB8B24','#E36414'],head:'#460B2F',red:'#9A031E',saf:'#FB8B24',org:'#E36414',ok:'#2f6b3a',paper:'#FFF7EA'},
{id:'most',n:'Most Indian Traditional',p:['#3D9A2E','#FFC60E','#FF6B0F','#8F2F72'],head:'#2B6E22',red:'#8F2F72',saf:'#FFC60E',org:'#D9570A',ok:'#2B6E22',paper:'#FFF9E0'},
{id:'fest',n:'Festival Mosaic',p:['#7ED04B','#CF2A6B','#1EAAB9','#F8F95F','#FD8D2B'],head:'#0E6F7A',red:'#C0225F',saf:'#FD8D2B',org:'#D26200',ok:'#2E7D32',paper:'#FFFBE6'},
{id:'prism',n:'Festive Prism',p:['#2D2D93','#E5348C','#FFE566','#F59643','#AC25BC'],head:'#2D2D93',red:'#A020B0',saf:'#F59643',org:'#D42A7C',ok:'#2f6b3a',paper:'#FFF9E6'},
{id:'spice',n:'Spice Market',p:['#832A2F','#CFC15C'],head:'#832A2F',red:'#832A2F',saf:'#CFC15C',org:'#B5651D',ok:'#3d6b2f',paper:'#FBF4E2'},
{id:'lotus',n:'Lotus Breeze',p:['#DD5964','#E4E2D3','#79C3B7','#306E91'],head:'#306E91',red:'#C23E4A',saf:'#79C3B7',org:'#C84B55',ok:'#2E7A6C',paper:'#F4F2E8'},
{id:'jewel',n:'Royal Jewel',p:['#0E0560','#0E2BA6','#DE3562','#D2B261','#106B38'],head:'#0E0560',red:'#D0214F',saf:'#D2B261',org:'#C95A1F',ok:'#106B38',paper:'#FAF5E6'},
{id:'sun',n:'Sunrise Bazaar',p:['#FC8F57','#CB3A32','#4FC174','#2A7864'],head:'#2A7864',red:'#CB3A32',saf:'#FC8F57',org:'#D2612A',ok:'#2A7864',paper:'#FFF6EC'},
{id:'brass',n:'Temple Brass',p:['#B8964B','#22925F','#8E2842','#C0C0C0'],head:'#3d2b12',red:'#8E2842',saf:'#B8964B',org:'#A8741A',ok:'#1C7A4D',paper:'#FBF5E6'},
{id:'mist',n:'Morning Mist',p:['#C7D3CD','#8697B0','#8A6C94','#D3B9B8'],head:'#5B4A6B',red:'#6E4F7B',saf:'#8697B0',org:'#A0626B',ok:'#3F6E5B',paper:'#F5F3F0'}];
function applyTheme(){const th=THEMES.find(x=>x.id===S.theme)||THEMES[0],r=document.documentElement;
  ['head','red','saf','org','ok','paper'].forEach(k=>r.style.setProperty('--t-'+k,th[k]));
  if(S.mode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.mode)}
function colourView(){
  return `<h3 class="note" style="margin:0 0 4px">${t('c')}</h3>`+THEMES.map(x=>`<button class="th" data-th="${x.id}" aria-pressed="${S.theme===x.id}"><span class="sw">${x.p.map(c=>`<i style="background:${c}"></i>`).join('')}</span>${x.n}</button>`).join('')
  +`<h3 class="note" style="margin:22px 0 0">${t('br')}</h3>`+[['auto','au'],['light','li'],['dark','dk']].map(m=>`<button class="gh" data-md="${m[0]}" aria-pressed="${S.mode===m[0]}" style="margin-right:8px">${t(m[1])}</button>`).join('');
}
function render(){chrome();$('main').innerHTML=hid!==null?histView():tab==='m'?monthView():tab==='s'?studentsView():tab==='c'?colourView():backupView()}
function modal(html){$('mod').innerHTML=`<div class="modal" id="mbg"><div class="sheet">${html}</div></div>`}
function close(){$('mod').innerHTML=''}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,.modal');if(!b)return;const d=b.dataset;
  if(b.id==='mbg'&&e.target===b){close();return}
  if(b.id==='lang'){S.lang=S.lang==='en'?'hi':'en';save();render()}
  else if(d.tab){tab=d.tab;hid=null;render()}
  else if(d.mv){cur=shift(cur,+d.mv);render()}
  else if(d.h){hid=d.h;render();scrollTo(0,0)}
  else if(d.back){hid=null;render()}
  else if(d.pay){const s=S.students.find(x=>x.id===d.pay),p=pay(s.id,cur);
    modal(`<h3>${esc(s.name)} · ${mname(cur)}</h3><label for="pd">${t('pd')}</label><input id="pd" type="date" value="${p?p.date:today()}">
    <label for="pa">${t('amt')}</label><input id="pa" type="number" inputmode="numeric" value="${p?p.amount:s.fee}">
    <button class="go" data-ok="${s.id}">${t('save')}</button> <button class="gh" data-x="1">${t('cancel')}</button>${p?` <button class="gh" data-unp="${s.id}">${t('unpaid')}</button>`:''}`)}
  else if(d.ok){const dt=$('pd').value,am=$('pa').value;if(dt&&am!==''){S.pay[d.ok+'|'+cur]={date:dt,amount:+am};save();close();render()}}
  else if(d.unp){delete S.pay[d.unp+'|'+cur];save();close();render()}
  else if(d.x){close()}
  else if(d.rm){S.students.find(x=>x.id===d.rm).active=false;save();render()}
  else if(d.rs){S.students.find(x=>x.id===d.rs).active=true;save();render()}
  else if(d.fee){const s=S.students.find(x=>x.id===d.fee);
    modal(`<h3>${esc(s.name)}</h3><label for="nf">${t('newfee')}</label><input id="nf" type="number" inputmode="numeric" value="${s.fee}"><p class="note">${t('chgnote')}</p>
    <button class="go" data-nf="${s.id}">${t('save')}</button> <button class="gh" data-x="1">${t('cancel')}</button>`)}
  else if(d.nf){const v=$('nf').value;if(v!==''){S.students.find(x=>x.id===d.nf).fee=+v;save();close();render()}}
  else if(d.th){S.theme=d.th;save();render()}
  else if(d.md){S.mode=d.md;save();render()}
  else if(b.id==='sel'){const a=$('bt');a.focus();a.select()}
  else if(b.id==='rb'){try{const o=JSON.parse($('rt').value);if(!Array.isArray(o.students)||typeof o.pay!=='object')throw 0;S.students=o.students;S.pay=o.pay;save();$('rmsg').textContent=t('done')}catch(x){$('rmsg').textContent=t('bad')}}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='addf')return;e.preventDefault();
  const n=$('an').value.trim(),f=$('af').value,s=$('as').value||curM;
  if(!n||f===''){$('err').textContent=t('needname');return}
  S.students.push({id:'s'+Date.now().toString(36),name:n,fee:+f,start:s,active:true});save();render()
});
render();
</script>
</body>
</html>
